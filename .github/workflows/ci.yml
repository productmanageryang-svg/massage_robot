name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The deployment target: Ubuntu 24.04 is what the NUC runs, and
    # requirements.txt pins versions that need Python 3.11+.
    #
    # What CI can honestly check: the tree installs, every module imports, the
    # config resolves, the plan tables are coherent, and the tuning constants
    # survive being split into their own module. What it cannot check is
    # recognition accuracy or force behaviour — both need the real arm and
    # camera. There is no simulator here on purpose: a fake stand-in would let
    # CI pass while the real machine misbehaves.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libgles2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import check
        run: |
          python -c "import heacon.config, heacon.motion.route, heacon.http.app"
          python -c "import heacon.vision.geometry, heacon.vision.body, heacon.vision.hybrid_geom"

      - name: Config resolves
        run: python main.py --print-config

      - name: Tests (no hardware required)
        run: python -m pytest tests/ -q

  no-mediapipe:
    # Recognition is optional at import time: a machine without mediapipe must
    # still boot and serve the page. It just cannot start a service.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libgles2
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest
      - name: Console still boots without the recogniser
        run: |
          python -c "import heacon.http.app; print('console imports without mediapipe')"
          python main.py --print-config
          # Only the tests that do not need recognition. tests/test_recognition_scale.py
          # exercises hybrid_geom, which imports mediapipe on first use.
          python -m pytest tests/test_config.py tests/test_plans.py -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Non-blocking: the motion code came from the field and is being tidied
      # incrementally. Tighten once the tree is clean.
      - run: ruff check heacon main.py tests --exit-zero
