# Do not start the console until the robot subnet is reachable.
#
# Without this, a cold boot starts the console while WiFi is still associating.
# The console then connects to nothing, and the operator sees 设备已离线 until
# someone restarts it by hand. The field NUC carries exactly this override.
[Unit]
After=network-online.target heacon-wait-net.service
Wants=network-online.target heacon-wait-net.service
